<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check Cropped Menu Images</title>
    <style>
        body {
            background-color: #0056D2;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .card {
            background-color: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .card img {
            max-width: 100%;
            height: auto;
            max-height: 150px;
            object-fit: contain;
            background-color: #234292;
            border-radius: 4px;
        }
        .card.white-bg img {
            background-color: white;
        }
        h2 {
            grid-column: 1 / -1;
            margin-top: 30px;
            border-bottom: 2px solid white;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Cropped Images Check</h1>
    <div class="grid">
        <h2>Koshari</h2>
        <div class="card">
            <p>Pistachio Lotus</p>
            <img src="./images/menu_trans/koshari_pistachio_lotus.png">
        </div>
        <div class="card">
            <p>Kinder Nutella</p>
            <img src="./images/menu_trans/koshari_kinder_nutella.png">
        </div>
        <div class="card">
            <p>Pistachio Nutella</p>
            <img src="./images/menu_trans/koshari_pistachio_nutella.png">
        </div>
        <div class="card">
            <p>Grand Trio</p>
            <img src="./images/menu_trans/koshari_grand_trio.png">
        </div>

        <h2>Salankatia</h2>
        <div class="card white-bg">
            <p>Pistachio Lotus</p>
            <img src="./images/menu_trans/salankatia_pistachio_lotus.png">
        </div>
        <div class="card white-bg">
            <p>Pistachio Nutella</p>
            <img src="./images/menu_trans/salankatia_pistachio_nutella.png">
        </div>
        <div class="card white-bg">
            <p>Grand Trio</p>
            <img src="./images/menu_trans/salankatia_grand_trio.png">
        </div>
        <div class="card white-bg">
            <p>Mango</p>
            <img src="./images/menu_trans/salankatia_mango.png">
        </div>

        <h2>Qashtuta</h2>
        <div class="card">
            <p>Mango</p>
            <img src="./images/menu_trans/qashtuta_mango.png">
        </div>
        <div class="card">
            <p>Kinder Nutella</p>
            <img src="./images/menu_trans/qashtuta_kinder_nutella.png">
        </div>
        <div class="card">
            <p>Pistachio Nutella</p>
            <img src="./images/menu_trans/qashtuta_pistachio_nutella.png">
        </div>
        <div class="card">
            <p>Banana Strawberry</p>
            <img src="./images/menu_trans/qashtuta_banana_strawberry.png">
        </div>
    </div>
</body>
</html>
